[workspace]
resolver = "3"
members = ["crates/omamori-proto", "crates/omamori-daemon", "crates/omamori-ipc", "crates/pam-omamori", "crates/omamori-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99.0"

[workspace.dependencies]
hmac = "0.13"
sha2 = "0.11"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
serde_json = "1"

[profile.release]
panic = "unwind"
lto = "thin"
