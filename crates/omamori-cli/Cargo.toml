[package]
name = "omamori-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
omamori-ipc = { path = "../omamori-ipc" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
tempfile = "3"
serde_json.workspace = true

[[bin]]
name = "omamori"
path = "src/main.rs"
